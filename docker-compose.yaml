version: '3.8'

services:
  web:
    build:
      context: src
    expose:
      - "8000"
    container_name: museum_app

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src/static:/app/static
    depends_on:
      - web
    container_name: museum_nginx
